<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>mandar aku sugih</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="STYLE.css">
</head>
<body>

  <div class="screen-switcher">
    <button class="switch-btn active" onclick="switchScreen('screen-welcome')">Welcome</button>
    <button class="switch-btn" onclick="switchScreen('screen-home')">Home</button>
  </div>

  <div class="app-mockup page-welcome" id="main-mockup">
    <div class="mobile-frame">
      
      <div class="screen active" id="screen-welcome">
        <div class="welcome-content">
          <img src="border.png" class="img-corner top-left" width="70">
          <img src="border.png" class="img-corner top-right" width="70">
          <img src="border.png" class="img-corner bottom-left" width="70">
          <img src="border.png" class="img-corner bottom-right" width="70">
          <img src="logome.png" width="150" alt="Logo">
          <h1 class="logo-title">Nei<span>Heree</span></h1>
          <p class="tagline">iwak tempe</p>
          <button class="btn-glow" onclick="switchScreen('screen-home')">
            Hop inn <i class="fa-solid fa-sparkles"></i>
          </button>
        </div>
      </div>

      <div class="screen" id="screen-home">
        <div class="home-header">
          <h2>Neii<span>Play</span></h2>
        </div>

        <div class="user-greeting">
          <h3>Glad to see u back, Neii</h3>
          <p>Lets gettin the vibe</p>
        </div>

        <div class="search-box">
          <h3>MY FAVV SINGERR RAHHH</h3>
        </div>

        <div class="banner-container">
          <div class="hero-banner banner-1">
            <div class="banner-info">
              <span>RnB</span>
              <h3>Chase Atlantic</h3>
            </div>
          </div>

          <div class="hero-banner banner-2">
            <div class="banner-info">
              <span>K-Pop</span>
              <h3>Cortis</h3>
            </div>
          </div>

          <div class="hero-banner banner-3">
            <div class="banner-info">
              <span>Metal</span>
              <h3>Metallica</h3>
            </div>
          </div>

          <div class="hero-banner banner-4">
            <div class="banner-info">
              <span>Metal</span>
              <h3>Slipknot</h3>
            </div>
          </div>
        </div> 

        <div class="music"> 
          <h3>Recently Played</h3>
        </div>

        <div class="search-box music-1">
          <img src="emboh.jpg" width="40">
          <h3>RedRed</h3>
          <div class="music-controls">
            <button class="btn-action"><i class="fa-solid fa-backward-step"></i></button>
            <button class="btn-play" onclick="window.open('whistle.mp4', '_blank')"><i class="fa-solid fa-play"></i></button>
            <button class="btn-action"><i class="fa-solid fa-forward-step"></i></button>
          </div>
        </div>

        <div class="search-box music-2">
          <img src="cuking.jpg" width="40">
          <h3>Con Calma</h3>
          <div class="music-controls">
            <button class="btn-action"><i class="fa-solid fa-backward-step"></i></button>
            <button class="btn-play" onclick="window.open('papa ayah.mp4', '_blank')"><i class="fa-solid fa-play"></i></button>
            <button class="btn-action"><i class="fa-solid fa-forward-step"></i></button>
          </div>
        </div>

        <div class="search-box music-3">
          <img src="luwe.jpg" width="40">
          <h3>Welcome To The Jungle</h3>
          <div class="music-controls">
            <button class="btn-action"><i class="fa-solid fa-backward-step"></i></button>
            <button class="btn-play" onclick="window.open('me when.mp4', '_blank')"><i class="fa-solid fa-play"></i></button>
            <button class="btn-action"><i class="fa-solid fa-forward-step"></i></button>
          </div>
        </div>

        <div class="search-box music-4">
          <img src="ngantuk.jpg" width="40">
          <h3>Eyeless</h3>
          <div class="music-controls">
            <button class="btn-action"><i class="fa-solid fa-backward-step"></i></button>
            <button class="btn-play" onclick="window.open('berkelas.mp4', '_blank')"><i class="fa-solid fa-play"></i></button>
            <button class="btn-action"><i class="fa-solid fa-forward-step"></i></button>
          </div>
        </div>

        <div class="player-bubble">
          <div class="player-top">
            <div class="action-group">
              <button class="btn-icon"><i class="fa-regular fa-heart"></i></button>
              <button class="btn-icon"><i class="fa-solid fa-music"></i></button>
              <button class="btn-icon"><i class="fa-solid fa-expand"></i></button>
            </div>

            <div class="playback-group">
              <button class="btn-sub"><i class="fa-solid fa-rotate-right"></i></button>
              <button class="btn-sub"><i class="fa-solid fa-backward-step"></i></button>
              <button class="btn-main-pause" onclick="window.open('kapalku.mp4', '_blank')"><i class="fa-solid fa-pause"></i></button>
              <button class="btn-sub"><i class="fa-solid fa-forward-step"></i></button>
              <button class="btn-sub"><i class="fa-solid fa-shuffle"></i></button>
            </div>
          </div>

          <div class="player-bottom">
            <span class="time">1:16</span>
            <input type="range" min="0" max="100" value="35" class="progress-bar">
            <span class="time">4:20</span>
          </div>
        </div>

      </div>
    </div>
  </div>
</body>
</html>
